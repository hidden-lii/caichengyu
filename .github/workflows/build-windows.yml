# 在 GitHub 云端打包 Windows 安装包（.exe / .msi）
# 触发方式：
# 1. Actions 页手动 Run workflow
# 2. 推送形如 v0.1.0 的 tag
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      # ONNX 模型未入库（.gitignore），打包前从 ModelScope 拉取
      - name: Download OCR models
        shell: pwsh
        run: |
          $dir = "src-tauri/resources/ocr"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $files = @(
            @{
              Name = "ch_PP-OCRv5_mobile_det.onnx"
              Url  = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.0.0/onnx/PP-OCRv5/det/ch_PP-OCRv5_mobile_det.onnx"
            },
            @{
              Name = "ch_ppocr_mobile_v2.0_cls_infer.onnx"
              Url  = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.7.0/onnx/PP-OCRv4/cls/ch_ppocr_mobile_v2.0_cls_infer.onnx"
            },
            @{
              Name = "ch_PP-OCRv5_rec_mobile_infer.onnx"
              Url  = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.0.0/onnx/PP-OCRv5/rec/ch_PP-OCRv5_rec_mobile_infer.onnx"
            }
          )
          foreach ($f in $files) {
            $out = Join-Path $dir $f.Name
            Write-Host "Downloading $($f.Name) ..."
            Invoke-WebRequest -Uri $f.Url -OutFile $out -UseBasicParsing
            if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 100000) {
              throw "Failed to download $($f.Name)"
            }
          }

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '猜成语 v__VERSION__'
          releaseBody: |
            Windows 安装包见下方 Assets。
            - `.exe`：NSIS 安装程序（安装后窗口标题仍为「猜成语」）

            ### v0.4.0
            - 本地 PP-OCRv5 识别（可与千问云端切换）
            - 内置汉文学网四字成语词库，可在词库设置切换
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
