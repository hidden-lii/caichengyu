[package]
name = "caichengyu-tauri"
version = "0.3.1"
description = "猜成语桌面应用"
authors = ["aki"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[dependencies]
tauri = { version = "1.4", features = ["clipboard-write-text", "dialog-open", "fs-read-file", "path-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
lazy_static = "1.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
